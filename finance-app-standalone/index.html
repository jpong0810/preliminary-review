<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance &amp; Research (Local)</title>
<style>
  :root {
    /* Ledger palette — dark ink ground, brass/parchment ink, no external fonts */
    --ink-950: #0A1118;
    --ink-900: #111A2B;
    --ink-850: #152238;
    --ink-800: #1B2A44;
    --hairline: rgba(199,165,68,0.14);
    --parchment: #ECE5D4;
    --parchment-dim: rgba(236,229,212,0.62);
    --parchment-faint: rgba(236,229,212,0.34);
    --brass: #C7A544;
    --brass-dim: rgba(199,165,68,0.55);
    --sage: #8FB088;
    --brick: #C1685A;
    --mist: #7C8AA0;

    /* same variable names the rest of the file already uses, remapped to the palette above */
    --border: var(--hairline);
    --text-muted: var(--mist);
    --text-secondary: var(--parchment-dim);
    --gridline: rgba(236,229,212,0.08);
    --status-good: var(--sage);
    --status-warning: #D6B370;
    --status-critical: var(--brick);

    /* categorical chart colors, drawn from the palette itself for thematic consistency */
    --series-1: var(--brass);
    --series-2: var(--sage);
    --series-3: #9CB4D8;
    --series-4: var(--brick);
    --series-5: #D6B370;
    --series-6: #B98F5C;
    --series-7: var(--mist);
    --series-8: var(--parchment);
    --series-other: rgba(236,229,212,0.30);

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--brass); color: var(--ink-950); }
  body {
    font-family: var(--font-sans);
    margin: 0;
    background: var(--ink-950);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(199,165,68,0.07), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(143,176,136,0.05), transparent);
    color: var(--parchment);
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  header h1 { font-family: var(--font-display); font-size: 23px; font-weight: 600; margin: 0 24px 0 0; letter-spacing: 0.2px; }
  header button.tab {
    background: none; border: none; padding: 10px 6px; margin-right: 20px; font-size: 14.5px; font-weight: 500;
    color: var(--mist); cursor: pointer; border-bottom: 2px solid transparent;
  }
  header button.tab.active { color: var(--brass); border-bottom-color: var(--brass); }
  header button.tab:hover:not(.active) { color: var(--parchment-dim); }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--ink-900); border: 1px solid var(--hairline); border-radius: 8px; padding: 22px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--mist); flex: 1; min-width: 150px; }
  input, select, textarea {
    font-size: 14.5px; padding: 9px 11px; border-radius: 5px; border: 1px solid var(--hairline);
    font-family: inherit; background: var(--ink-850); color: var(--parchment);
  }
  input::placeholder, textarea::placeholder { color: var(--parchment-faint); }
  textarea { min-height: 64px; resize: vertical; }
  button.primary {
    background: var(--brass); color: var(--ink-950); border: none; padding: 9px 18px;
    border-radius: 5px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  button.secondary {
    background: transparent; border: 1px solid var(--hairline); color: var(--parchment-dim); padding: 8px 16px;
    border-radius: 5px; font-size: 14.5px; font-weight: 500; cursor: pointer;

  button.tiny {
    background: none; border: 1px solid var(--hairline); color: var(--parchment-dim); padding: 4px 10px; border-radius: 5px;

  button.tiny.danger { color: var(--brick); border-color: rgba(193,104,90,0.4); }
  button.tab-btn {
    background: none; border: none; padding: 10px 6px; margin-right: 4px; font-size: 14.5px; font-weight: 500;
    color: var(--mist); cursor: pointer; border-bottom: 2px solid transparent;
  }
  button.tab-btn.active { color: var(--brass); border-bottom-color: var(--brass); }
  button.tab-btn:hover:not(.active) { color: var(--parchment-dim); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  th { color: var(--mist); font-weight: 500; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); }
  .tkr { font-family: var(--font-mono); color: var(--brass); font-weight: 500; }
  .pill, button.pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    background: rgba(236,229,212,0.05); border: 1px solid var(--hairline); color: var(--parchment-dim);
    margin: 2px 3px 2px 0; font-family: inherit; cursor: default;
  }
  button.pill { cursor: pointer; }
  button.pill:hover, button.pill.on { border-color: var(--brass-dim); color: var(--brass); background: rgba(199,165,68,0.10); }
  .pill.bullish { background: rgba(143,176,136,0.14); border-color: rgba(143,176,136,0.3); color: var(--sage); }
  .pill.bearish { background: rgba(193,104,90,0.14); border-color: rgba(193,104,90,0.3); color: var(--brick); }
  .pill.neutral { background: rgba(124,138,160,0.12); border-color: rgba(124,138,160,0.25); color: var(--mist); }
  .stat { display: flex; flex-direction: column; gap: 5px; }
  .stat .label { font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--mist); }
  .stat .value { font-family: var(--font-display); font-size: 27px; font-weight: 500; color: var(--parchment); }
  .muted { color: var(--mist); font-size: 14px; }
  .section-title { font-family: var(--font-display); font-size: 16.5px; font-weight: 500; color: var(--parchment); margin: 2px 0 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .bar-track { flex: 1; height: 6px; background: var(--gridline); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brass); border-radius: 3px; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .donut { border-radius: 50%; position: relative; flex-shrink: 0; }
  .donut::after { content: ""; position: absolute; inset: 24%; background: var(--ink-900); border-radius: 50%; }
  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--parchment-dim); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
  .chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .constellation {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px;
    min-height: 220px; padding: 26px 16px;
  }
  .bubble {
    display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%;
    cursor: pointer; border: 1px solid; text-align: center; line-height: 1.3; padding: 6px;
    background: rgba(255,255,255,0.02); transition: transform .15s ease, box-shadow .15s ease;
  }
  .bubble:hover { transform: translateY(-3px); }
  .bubble.selected { box-shadow: 0 0 0 2px var(--brass), 0 8px 22px rgba(199,165,68,0.22); }
  .bubble .b-name { font-size: 12px; font-weight: 500; padding: 0 8px; }
  .bubble .b-val { font-family: var(--font-mono); font-size: 11.5px; opacity: 0.8; margin-top: 2px; }
  .err { background: rgba(193,104,90,0.14); border: 1px solid rgba(193,104,90,0.3); color: var(--brick); padding: 9px 14px; border-radius: 6px; font-size: 14px; }
  .ok { background: rgba(143,176,136,0.14); border: 1px solid rgba(143,176,136,0.3); color: var(--sage); padding: 9px 14px; border-radius: 6px; font-size: 14px; }
  .hidden { display: none !important; }
  a { color: var(--brass); }
  .thread { border-left: 2px solid var(--hairline); margin-left: 8px; padding-left: 14px; }
</style>

<body>

  <h1>Finance &amp; Research <span style="font-weight:400;color:var(--mist);">(local)</span></h1>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const SB_URL = "https://tdprdukhxmjshtvyakmy.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkcHJkdWtoeG1qc2h0dnlha215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2Njk5OTksImV4cCI6MjA5OTI0NTk5OX0.j_I1PjSdwKeTgECBXj3mSqJ9T8r2Hql6-7G0NVyC9WQ";

// ---------------------------------------------------------------------------
// Tiny Supabase REST helper
// ---------------------------------------------------------------------------
async function sb(table, { method = "GET", query = "", body, prefer } = {}) {
  const url = `${SB_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
  const res = await fetch(url, {
    method,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",
      Prefer: prefer || (method === "POST" || method === "PATCH" ? "return=representation" : ""),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`${method} ${table} failed (${res.status}): ${t}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
const sbGet = (table, query = "select=*") => sb(table, { query });
const sbInsert = (table, data) => sb(table, { method: "POST", body: data });
const sbUpdate = (table, id, data) => sb(table, { method: "PATCH", query: `id=eq.${id}`, body: data });
const sbDelete = (table, id) => sb(table, { method: "DELETE", query: `id=eq.${id}` });

function showStatus(msg, isError) {
  const el = document.getElementById("status");
  el.innerHTML = `<div class="${isError ? "err" : "ok"}">${escapeHtml(msg)}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 5000);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtUsd(n) {
  return (n ?? 0).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
}
function fmtDate(d) {
  if (!d) return "";
  return new Date(d).toLocaleDateString();
}
function pills(tags) {
  return (tags || []).map((t) => `<span class="pill">${escapeHtml(t)}</span>`).join("");
}
function csvToArray(s) {
  return (s || "").split(",").map((x) => x.trim()).filter(Boolean);
}
function linesToArray(s) {
  return (s || "").split("\n").map((x) => x.trim()).filter(Boolean);
}

// Categorical donut chart, no chart library — pure CSS conic-gradient, so it never
// depends on any network request (avoids repeating the exact problem this file
// exists to work around). Colors follow the dataviz skill's validated 8-hue order.
const CHART_COLORS = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)", "var(--series-6)", "var(--series-7)", "var(--series-8)"];
function donutChart(map, size) {
  size = size || 110;
  const entries = Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  if (!total) return `<div class="muted">No data yet.</div>`;
  let top = entries.slice(0, 7);
  const rest = entries.slice(7);
  if (rest.length) top = [...top, ["Other", rest.reduce((s, [, v]) => s + v, 0)]];

  let acc = 0;
  const colorFor = (label, i) => (label === "Other" && rest.length ? "var(--series-other)" : CHART_COLORS[i % CHART_COLORS.length]);
  const stops = top.map(([label, v], i) => {
    const start = (acc / total) * 100;
    acc += v;
    const end = (acc / total) * 100;
    return `${colorFor(label, i)} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
  }).join(", ");
  const legend = top.map(([label, v], i) => `
    <div><span class="legend-dot" style="background:${colorFor(label, i)}"></span>${escapeHtml(label)} <span class="muted">${(v / total * 100).toFixed(1)}%</span></div>
  `).join("");
  return `
    <div class="donut-wrap">
      <div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${stops})"></div>
      <div class="legend">${legend}</div>
    </div>
  `;
}

// Lightweight, local-only sector guesser — no AI available in this file, so this is a
// keyword/ticker heuristic rather than true classification. Runs automatically at save
// time if Sector is left blank, and is also available via the "Guess" button.
const TICKER_SECTOR_MAP = {
  SPY: "Broad Market", VOO: "Broad Market", IVV: "Broad Market", QQQ: "Broad Market", IWM: "Broad Market",
  SMH: "Technology", SOXX: "Technology", XLK: "Technology", XLF: "Financials", XLV: "Healthcare",
  XLE: "Energy", XLU: "Utilities", XLI: "Industrials", XLB: "Materials", XLY: "Consumer Discretionary",
  XLP: "Consumer Staples", XLC: "Communication Services", XLRE: "Real Estate",
  CASH: "Cash Equivalent", USD: "Cash Equivalent", HKD: "Cash Equivalent", EUR: "Cash Equivalent", GBP: "Cash Equivalent", "UBS-CALL": "Cash Equivalent",
};
const SECTOR_KEYWORDS = [
  { pattern: /\b(cash|deposit|call deposit|call account|money market|treasury bill|t-bill|current account)\b/i, sector: "Cash Equivalent" },
  { pattern: /\b(semiconductor|chip|software|cloud|internet|cyber|nasdaq.*tech)\b/i, sector: "Technology" },
  { pattern: /\b(bank|broker|dealer|financial|insurance|exchange)\b/i, sector: "Financials" },
  { pattern: /\b(health|pharma|biotech|medical)\b/i, sector: "Healthcare" },
  { pattern: /\b(energy|oil|gas|petroleum)\b/i, sector: "Energy" },
  { pattern: /\b(utilit|power grid|electric grid)\b/i, sector: "Utilities" },
  { pattern: /\b(real estate|reit|property)\b/i, sector: "Real Estate" },
  { pattern: /\b(industrial|transport|airline|logistics|defense|aerospace|infrastructure)\b/i, sector: "Industrials" },
  { pattern: /\b(material|mining|metal|chemical)\b/i, sector: "Materials" },
  { pattern: /\b(consumer discretionary|retail|apparel|auto)\b/i, sector: "Consumer Discretionary" },
  { pattern: /\b(consumer staples|food|beverage|household)\b/i, sector: "Consumer Staples" },
  { pattern: /\b(communication|media|telecom|entertainment)\b/i, sector: "Communication Services" },
  { pattern: /\b(s&p ?500|russell|nasdaq ?100|total market|broad market|dow jones)\b/i, sector: "Broad Market" },
];
function guessSector(ticker, name, category) {
  const t = (ticker || "").toUpperCase().trim();
  if (TICKER_SECTOR_MAP[t]) return TICKER_SECTOR_MAP[t];
  if ((category || "").toLowerCase() === "cash") return "Cash Equivalent";
  const haystack = `${name || ""} ${category || ""}`;
  for (const { pattern, sector } of SECTOR_KEYWORDS) if (pattern.test(haystack)) return sector;
  return "Unclassified";
}

// ---------------------------------------------------------------------------
// Global data cache
// ---------------------------------------------------------------------------
let DB = {
  accounts: [], holdings: [], rules: [], thoughts: [], research: [],
  digestSources: [], digestSyntheses: [], calls: [], insights: [], todos: [],
};
let currentTab = "investments";

async function loadAll() {
  try {
    const [accounts, holdings, rules, thoughts, research, digestSources, digestSyntheses, calls, insights, todos] = await Promise.all([
      sbGet("accounts", "select=*&order=name.asc"),
      sbGet("holdings", "select=*&order=updated_at.desc"),
      sbGet("rules", "select=*"),
      sbGet("thoughts", "select=*&order=date.desc"),
      sbGet("research_entries", "select=*&order=date.desc"),
      sbGet("digest_sources", "select=*&order=date_logged.desc"),
      sbGet("digest_syntheses", "select=*&order=week_of.desc"),
      sbGet("calls", "select=*&order=date_made.desc"),
      sbGet("insights", "select=*&order=date_saved.desc"),
      sbGet("todos", "select=*&order=created_at.desc"),
    ]);
    DB = { accounts, holdings, rules, thoughts, research, digestSources, digestSyntheses, calls, insights, todos };
    render();
  } catch (e) {
    showStatus(e.message, true);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll("button.tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  render();
  if (tab === "rules") refreshExposureRules(false);
}
document.querySelectorAll("button.tab").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));

function render() {
  const view = document.getElementById("view");
  const renderers = {
    investments: renderInvestments, rules: renderRules, thoughts: renderThoughts, research: renderResearch,
    digest: renderDigest, calls: renderCalls, insights: renderInsights,
    tags: renderTags, lineage: renderLineage, todo: renderTodo,
  };
  view.innerHTML = (renderers[currentTab] || renderInvestments)();
  attachHandlers[currentTab] && attachHandlers[currentTab]();
}
const attachHandlers = {};

// ---------------------------------------------------------------------------
// Investments
// ---------------------------------------------------------------------------
let invTab = "overall"; // "overall" or an account id
let invOverallIds = null; // null until accounts load, then defaults to all account ids
let invKnownAccountIds = null; // tracks which account ids the picker has already reconciled, so an
                                // intentional uncheck isn't mistaken for "never seen this account before"
let invShowPicker = false;
let invEditingId = null;
let invChartMode = "sector"; // "sector" or "theme"
let invThemeFilter = null; // a theme (tag) name, or null for no filter
let invConsolidate = true; // group same ticker across accounts into one row
let invSortKey = "usdValue"; // "usdValue" or "geography"
let invSortDir = "desc"; // holdings table sort direction

// When consolidating, holdings sharing a ticker collapse into one row (summed USD value,
// merged themes). Edit/Delete only make sense on a single underlying holding, so grouped
// rows hide those actions — switch to a single account tab, or turn consolidation off,
// to edit/delete a specific one.
function consolidateHoldings(rows) {
  const map = new Map();
  for (const h of rows) {
    const key = h.ticker.toUpperCase();
    if (!map.has(key)) {
      map.set(key, { ticker: h.ticker, name: h.name, category: h.category, sector: h.sector, geography: h.geography, tags: new Set(), usdValue: 0, accountIds: new Set(), members: [] });
    }
    const g = map.get(key);
    g.usdValue += usdValue(h);
    g.accountIds.add(h.account_id);
    g.members.push(h);
    (h.tags || []).forEach((t) => g.tags.add(t));
    if (g.sector !== h.sector) g.sector = "Mixed";
    if (g.category !== h.category) g.category = "Mixed";
    if (g.geography !== h.geography) g.geography = "Mixed";
  }
  return Array.from(map.values()).map((g) => ({ ...g, tags: Array.from(g.tags) }));
}

function usdValue(h) { return (h.quantity || 0) * (h.price || 0) * (h.fx_rate_to_usd || 1); }

// Themes reuse the same "tags" field holdings already have — sector is a separate,
// auto-suggested single classification (see guessSector above); themes are freeform
// and a holding can belong to more than one.
function themeMapFor(holdings) {
  const map = {};
  holdings.forEach((h) => {
    (h.tags || []).forEach((t) => {
      map[t] = map[t] || { value: 0, count: 0 };
      map[t].value += usdValue(h);
      map[t].count++;
    });
  });
  return map;
}
function themeConstellation(map, total) {
  const entries = Object.entries(map).sort((a, b) => b[1].value - a[1].value);
  if (!entries.length) return `<div class="muted">No themes tagged yet — add some in the "Themes" field when adding or editing a holding.</div>`;
  const maxV = Math.max(...entries.map(([, d]) => d.value));
  const minSize = 74, maxSize = 168;
  const bubbles = entries.map(([name, d], i) => {
    const frac = Math.sqrt(Math.max(d.value, 1) / maxV);
    const size = Math.round(minSize + frac * (maxSize - minSize));
    const color = CHART_COLORS[i % CHART_COLORS.length];
    const pct = total ? (d.value / total * 100).toFixed(1) : "0.0";
    const active = invThemeFilter === name ? " selected" : "";
    return `
      <div class="bubble${active}" style="width:${size}px;height:${size}px;border-color:${color};color:${color}" data-theme-bubble="${escapeHtml(name)}">
        <div class="b-name">${escapeHtml(name)}</div>
        <div class="b-val">${fmtUsd(d.value)}</div>
        <div class="b-val">${pct}%</div>
      </div>`;
  }).join("");
  return `<div class="constellation">${bubbles}</div>`;
}
function themeChips(tags) {
  return (tags || []).map((t) => `<button type="button" class="pill${invThemeFilter === t ? " on" : ""}" data-theme-chip="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("");
}

function renderInvestments() {
  const currentIds = new Set(DB.accounts.map((a) => a.id));
  if (invOverallIds === null || invKnownAccountIds === null) {
    invOverallIds = [...currentIds];
    invKnownAccountIds = new Set(currentIds);
  } else {
    for (const id of currentIds) {
      if (!invKnownAccountIds.has(id)) { invOverallIds.push(id); invKnownAccountIds.add(id); } // genuinely new account -> default included
    }
    for (const id of [...invKnownAccountIds]) {
      if (!currentIds.has(id)) { invKnownAccountIds.delete(id); invOverallIds = invOverallIds.filter((x) => x !== id); } // deleted account -> drop
    }
  }
  if (invTab !== "overall" && !DB.accounts.some((a) => a.id === invTab)) invTab = "overall";
  const scoped = invTab === "overall"
    ? DB.holdings.filter((h) => invOverallIds.includes(h.account_id))
    : DB.holdings.filter((h) => h.account_id === invTab);
  const total = scoped.reduce((s, h) => s + usdValue(h), 0);
  const cash = scoped.filter((h) => (h.category || "").toLowerCase() === "cash").reduce((s, h) => s + usdValue(h), 0);
  const bySector = {}, byCategory = {}, byGeography = {};
  scoped.forEach((h) => {
    const v = usdValue(h);
    bySector[h.sector] = (bySector[h.sector] || 0) + v;
    byCategory[h.category] = (byCategory[h.category] || 0) + v;
    byGeography[h.geography] = (byGeography[h.geography] || 0) + v;
  });
  const topHoldings = [...scoped].sort((a, b) => usdValue(b) - usdValue(a)).slice(0, 8);
  const maxHoldingValue = topHoldings.length ? usdValue(topHoldings[0]) : 0;
  const accountName = (id) => DB.accounts.find((a) => a.id === id)?.name || "—";
  const filteredHoldings = invThemeFilter ? scoped.filter((h) => (h.tags || []).includes(invThemeFilter)) : scoped;
  let displayRows = invConsolidate
    ? consolidateHoldings(filteredHoldings)
    : filteredHoldings.map((h) => ({ ticker: h.ticker, name: h.name, category: h.category, sector: h.sector, geography: h.geography, tags: h.tags || [], usdValue: usdValue(h), accountIds: new Set([h.account_id]), members: [h] }));
  displayRows = [...displayRows].sort((a, b) => {
    const cmp = invSortKey === "geography" ? (a.geography || "").localeCompare(b.geography || "") : a.usdValue - b.usdValue;

      <div class="card stat"><span class="label">Total (USD)</span><span class="value">${fmtUsd(total)}</span></div>
      <div class="card stat"><span class="label">Cash</span><span class="value">${fmtUsd(cash)}</span></div>

      </div>
      ${invChartMode === "sector" ? `

            <div class="section-title">Top holdings</div>

        </div>` : `
        <div class="muted" style="margin:8px 0 0">Exposure grouped by theme rather than sector — sized by dollar value. Click a bubble, or a theme chip in the table below, to filter the holdings list.</div>

        <label class="field">Sector (auto-classified — leave blank to guess from ticker/name)
          <div class="row" style="gap:6px;flex-wrap:nowrap">

        <label class="field">Currency <input id="h-currency" value="${escapeHtml(editing?.currency || "USD")}" /></label>

      <div class="row" style="margin-top:8px">

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="section-title" style="margin:0">Holdings</div>
        <label class="row" style="gap:6px;font-size:12px;color:var(--mist)">

        </thead>

          ${displayRows.map((row) => {

  const overallBtn = document.getElementById("inv-tab-overall");
  if (overallBtn) overallBtn.addEventListener("click", () => {
    if (invTab !== "overall") { invTab = "overall"; invShowPicker = false; }
    else invShowPicker = !invShowPicker;
    render();
  });
  document.querySelectorAll("[data-inv-tab]").forEach((b) => b.addEventListener("click", () => {
    invTab = Number(b.dataset.invTab);
    invShowPicker = false;
    render();
  }));
  document.querySelectorAll("[data-inv-overall-toggle]").forEach((b) => b.addEventListener("change", () => {
    const id = Number(b.dataset.invOverallToggle);
    invOverallIds = invOverallIds.includes(id) ? invOverallIds.filter((x) => x !== id) : [...invOverallIds, id];
    render();
  }));

  document.querySelectorAll("[data-chart-mode]").forEach((b) => b.addEventListener("click", () => { invChartMode = b.dataset.chartMode; render(); }));
  function toggleThemeFilter(name) {
    invThemeFilter = invThemeFilter === name ? null : name;
    invChartMode = "theme";
    render();
  }
  document.querySelectorAll("[data-theme-bubble]").forEach((b) => b.addEventListener("click", () => toggleThemeFilter(b.dataset.themeBubble)));
  document.querySelectorAll("[data-theme-chip]").forEach((b) => b.addEventListener("click", () => toggleThemeFilter(b.dataset.themeChip)));
  const clearThemeFilterBtn = document.getElementById("inv-clear-theme-filter");
  if (clearThemeFilterBtn) clearThemeFilterBtn.addEventListener("click", () => { invThemeFilter = null; render(); });

  const consolidateToggle = document.getElementById("inv-consolidate-toggle");
  if (consolidateToggle) consolidateToggle.addEventListener("change", (e) => { invConsolidate = e.target.checked; render(); });
  function setInvSort(key) {
    if (invSortKey === key) invSortDir = invSortDir === "desc" ? "asc" : "desc";
    else { invSortKey = key; invSortDir = key === "geography" ? "asc" : "desc"; }
    render();
  }
  const sortValueHeader = document.getElementById("inv-sort-value");
  if (sortValueHeader) sortValueHeader.addEventListener("click", () => setInvSort("usdValue"));
  const sortGeoHeader = document.getElementById("inv-sort-geography");
  if (sortGeoHeader) sortGeoHeader.addEventListener("click", () => setInvSort("geography"));

  const sectorGuessBtn = document.getElementById("h-sector-guess");
  if (sectorGuessBtn) sectorGuessBtn.addEventListener("click", () => {
    document.getElementById("h-sector").value = guessSector(
      document.getElementById("h-ticker").value,
      document.getElementById("h-name").value,
      document.getElementById("h-category").value
    );
  });

  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => { invEditingId = Number(b.dataset.edit); render(); }));
  document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Delete this holding?")) return;
    try { await sbDelete("holdings", Number(b.dataset.del)); showStatus("Holding deleted"); await loadAll(); }
    catch (e) { showStatus(e.message, true); }
  }));
  const cancelBtn = document.getElementById("h-cancel-btn");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { invEditingId = null; render(); });

  const saveBtn = document.getElementById("h-save-btn");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const ticker = document.getElementById("h-ticker").value.trim();
    const name = document.getElementById("h-name").value.trim();
    const category = document.getElementById("h-category").value.trim();
    const sector = document.getElementById("h-sector").value.trim() || guessSector(ticker, name, category);
    const data = {
      ticker,
      name,
      category,
      sector,
      geography: document.getElementById("h-geography").value.trim(),
      account_id: Number(document.getElementById("h-account").value),
      quantity: parseFloat(document.getElementById("h-quantity").value) || 0,
      price: parseFloat(document.getElementById("h-price").value) || 0,
      currency: document.getElementById("h-currency").value.trim() || "USD",
      fx_rate_to_usd: parseFloat(document.getElementById("h-fx").value) || 1,
      cost_basis: document.getElementById("h-cost").value ? parseFloat(document.getElementById("h-cost").value) : null,
      tags: csvToArray(document.getElementById("h-tags").value),
      notes: document.getElementById("h-notes").value.trim() || null,
      updated_at: new Date().toISOString(),
    };
    if (!data.ticker || !data.name || !data.account_id) return showStatus("Ticker, name, and account are required", true);
    try {
      if (invEditingId) { await sbUpdate("holdings", invEditingId, data); showStatus("Holding updated"); }
      else { await sbInsert("holdings", data); showStatus("Holding added"); }
      invEditingId = null;
      await loadAll();
    } catch (e) { showStatus(e.message, true); }
  });
};

// ---------------------------------------------------------------------------
// Rules — live compliance checking against current holdings
// ---------------------------------------------------------------------------
const NINETY_DAYS_MS = 90 * 24 * 60 * 60 * 1000;
const RULE_SECTIONS = ["Allocation targets", "Cash management", "Stock-specific", "Process/discipline"];
const RULE_STATUS_COLOR = { ok: "var(--status-good)", close: "var(--status-warning)", breached: "var(--status-critical)", unmapped: "var(--series-6)" };
const RULE_STATUS_LABEL = { ok: "OK", close: "Close", breached: "Breached", unmapped: "Needs mapping" };
const RULE_STATUS_RANK = { breached: 0, unmapped: 1, close: 2, ok: 3 };
const RULE_COUNT_HINT_RE = /count|number of|how many|distinct|individual stock|positions?\b/i;
const RULE_CLOSE_MARGIN_PCT = 2;
const RULE_CLOSE_MARGIN_COUNT = 1;
let rulesRefreshing = false;

function classifyRuleStatus(actual, operator, threshold, margin) {
  const breached = operator === "min" ? actual < threshold : actual > threshold;
  if (breached) return "breached";
  return Math.abs(actual - threshold) <= margin ? "close" : "ok";
}
function inferRuleSection(metric, label, target) {
  if (metric === "holding") return "Stock-specific";
  if (`${label} ${target}`.toLowerCase().includes("cash")) return "Cash management";
  return "Allocation targets";
}
// Case-insensitive exact match first, then substring fuzzy match; "none" means no reasonable match at all.
function findRuleMatch(target, candidates) {
  const t = (target || "").trim().toLowerCase();
  const exact = candidates.find((c) => (c || "").toLowerCase() === t);
  if (exact != null) return { kind: "exact", value: exact };
  const fuzzy = candidates.find((c) => (c || "").toLowerCase().includes(t) || t.includes((c || "").toLowerCase()));
  if (fuzzy != null) return { kind: "fuzzy", value: fuzzy };
  return { kind: "none" };
}

/** Evaluates one exposure rule live against current holdings: ok/close/breached/unmapped status,
 * a human note, and a section grouping — plus best-effort fuzzy matching for metric/target
 * combos that don't line up exactly with a holding field. */
function evaluateExposureRule(rule, holdings) {
  const total = holdings.reduce((s, h) => s + usdValue(h), 0);
  const metric = rule.metric || "";
  const target = rule.target || "";
  const operator = rule.operator === "min" ? "min" : "max";
  const threshold = rule.threshold || 0;
  const section = inferRuleSection(metric, rule.label, target);
  const base = { ruleId: rule.id, label: rule.label, metric, target, operator, threshold, section };

  if (!total) return { ...base, actualValue: 0, unit: "pct", status: "unmapped", note: "No holdings to evaluate against." };

  if (metric === "holding") {
    const tickers = Array.from(new Set(holdings.map((h) => h.ticker)));
    const tickerMatch = tickers.find((t) => t.toLowerCase() === target.toLowerCase());
    if (tickerMatch) {
      const matchedUsd = holdings.filter((h) => h.ticker.toLowerCase() === target.toLowerCase()).reduce((s, h) => s + usdValue(h), 0);
      const actualPct = (matchedUsd / total) * 100;
      return { ...base, actualValue: actualPct, unit: "pct", status: classifyRuleStatus(actualPct, operator, threshold, RULE_CLOSE_MARGIN_PCT), note: `${target} at ${actualPct.toFixed(1)}%, ${operator} ${threshold}%` };
    }
    if (RULE_COUNT_HINT_RE.test(`${rule.label} ${target}`)) {
      const stockOnly = /stock/i.test(`${rule.label} ${target}`);
      const count = stockOnly
        ? new Set(holdings.filter((h) => (h.category || "").toLowerCase() === "stock").map((h) => h.ticker)).size
        : tickers.length;
      return { ...base, actualValue: count, unit: "count", status: classifyRuleStatus(count, operator, threshold, RULE_CLOSE_MARGIN_COUNT), note: `${count} distinct ${stockOnly ? "stock" : "holding"} positions, ${operator} ${threshold}` };
    }
    return { ...base, actualValue: 0, unit: "pct", status: "unmapped", note: `"${target}" doesn't match any ticker or a recognizable position-count rule — needs manual mapping.` };
  }

  const candidatesByMetric = {
    category: Array.from(new Set(holdings.map((h) => h.category))),
    sector: Array.from(new Set(holdings.map((h) => h.sector))),
    tag: Array.from(new Set(holdings.flatMap((h) => h.tags || []))),
    geography: Array.from(new Set(holdings.map((h) => h.geography))),
  };
  const candidates = candidatesByMetric[metric];
  if (!candidates) return { ...base, actualValue: 0, unit: "pct", status: "unmapped", note: `Unrecognized metric "${metric}" — needs manual mapping.` };

  const match = findRuleMatch(target, candidates);
  if (match.kind === "none") return { ...base, actualValue: 0, unit: "pct", status: "unmapped", note: `"${target}" doesn't cleanly match any ${metric} in your holdings — needs manual mapping.` };

  const matchedLabel = match.value;
  const matchedUsd = metric === "tag"
    ? holdings.filter((h) => (h.tags || []).some((t) => t.toLowerCase() === matchedLabel.toLowerCase())).reduce((s, h) => s + usdValue(h), 0)
    : holdings.filter((h) => (h[metric] || "").toLowerCase() === matchedLabel.toLowerCase()).reduce((s, h) => s + usdValue(h), 0);

  const actualPct = (matchedUsd / total) * 100;
  const fuzzyNote = match.kind === "fuzzy" ? ` (matched "${matchedLabel}")` : "";
  return { ...base, actualValue: actualPct, unit: "pct", status: classifyRuleStatus(actualPct, operator, threshold, RULE_CLOSE_MARGIN_PCT), note: `${target}${fuzzyNote} at ${actualPct.toFixed(1)}%, ${operator} ${threshold}%` };
}

/** Recomputes every exposure rule live, and persists last_status/last_checked/last_note for any
 * rule whose last_checked is null or >90 days old (or all of them, when `force` is set). */
async function refreshExposureRules(force) {
  const exposureRules = DB.rules.filter((r) => r.rule_type === "exposure");
  const now = new Date();
  const stale = exposureRules.filter((r) => force || !r.last_checked || now.getTime() - new Date(r.last_checked).getTime() > NINETY_DAYS_MS);
  if (!stale.length) return;
  for (const r of stale) {
    const ev = evaluateExposureRule(r, DB.holdings);
    try {
      await sbUpdate("rules", r.id, { last_status: ev.status, last_checked: now.toISOString(), last_note: ev.note });
    } catch (e) {
      showStatus(e.message, true);
    }
  }
  await loadAll();
}

function fmtRuleValue(r) { return r.unit === "pct" ? `${r.actualValue.toFixed(1)}%` : String(Math.round(r.actualValue)); }
function fmtRuleThreshold(r) { return r.unit === "pct" ? `${r.threshold}%` : String(r.threshold); }

      </div>
    </div>`;
}
function checklistRuleCardHtml(r) {

        </div>
        <span class="muted" style="font-size:12px">last reviewed ${fmtDate(r.last_checked) || "never"}</span>
      </div>
      ${r.last_note ? `<div class="muted" style="font-size:12.5px">Note: ${escapeHtml(r.last_note)}</div>` : ""}
      <div class="row" style="gap:8px">
        <input placeholder="Add a review note…" data-rule-note="${r.id}" style="flex:1;font-size:12.5px" />
        <button class="tiny" data-mark-reviewed="${r.id}">Mark reviewed</button>
      </div>
    </div>`;
}

function renderRules() {
  const exposureEvaluated = DB.rules.filter((r) => r.rule_type === "exposure").map((r) => ({ ...evaluateExposureRule(r, DB.holdings), lastChecked: r.last_checked }));
  const priceRules = DB.rules.filter((r) => r.rule_type === "price");

  const bySection = {};
  RULE_SECTIONS.forEach((s) => (bySection[s] = { exposure: [], price: [] }));
  exposureEvaluated.forEach((r) => bySection[r.section].exposure.push(r));
  priceRules.forEach((r) => bySection["Process/discipline"].price.push(r));
  Object.values(bySection).forEach((bucket) => {
    bucket.exposure.sort((a, b) => RULE_STATUS_RANK[a.status] - RULE_STATUS_RANK[b.status]);
    bucket.price.sort((a, b) => (a.last_checked ? new Date(a.last_checked).getTime() : -1) - (b.last_checked ? new Date(b.last_checked).getTime() : -1));
  });

  const sectionsHtml = RULE_SECTIONS.map((section) => {
    const bucket = bySection[section];
    if (!bucket.exposure.length && !bucket.price.length) return "";
    return `
      <div class="card">
        <div class="section-title">${escapeHtml(section)}</div>
        ${bucket.exposure.map(exposureRuleRowHtml).join("")}
        ${bucket.price.map(checklistRuleCardHtml).join("")}
      </div>`;
  }).join("");

  return `
    <div class="row" style="justify-content:flex-end">
      <button class="secondary" id="rules-refresh-btn" ${rulesRefreshing ? "disabled" : ""}>${rulesRefreshing ? "Refreshing…" : "Refresh now"}</button>
    </div>
    ${sectionsHtml || `<div class="card muted">No rules saved yet.</div>`}
  `;
}
attachHandlers.rules = () => {
  const refreshBtn = document.getElementById("rules-refresh-btn");
  if (refreshBtn) refreshBtn.addEventListener("click", async () => {
    rulesRefreshing = true;
    render();

    finally { rulesRefreshing = false; render(); }
  });
  document.querySelectorAll("[data-mark-reviewed]").forEach((b) => b.addEventListener("click", async () => {

    } catch (e) { showStatus(e.message, true); }
  }));
};

// ---------------------------------------------------------------------------
// Tags (cross-module)
// ---------------------------------------------------------------------------
let tagsSelected = null;
function renderTags() {
  const map = {};
  const add = (tag, module, label, id) => {
    if (!map[tag]) map[tag] = [];
    map[tag].push({ module, label, id });
  };
  DB.holdings.forEach((h) => (h.tags || []).forEach((t) => add(t, "Holding", `${h.ticker} — ${h.name}`, h.id)));
  DB.thoughts.forEach((t) => (t.tags || []).forEach((tag) => add(tag, "Thought", t.text.slice(0, 60), t.id)));
  DB.research.forEach((r) => (r.tags || []).forEach((tag) => add(tag, "Research", r.topic, r.id)));
  DB.digestSources.forEach((s) => (s.tags || []).forEach((tag) => add(tag, "Digest source", s.title, s.id)));
  DB.digestSyntheses.forEach((s) => (s.tags || []).forEach((tag) => add(tag, "Digest synthesis", `Week of ${fmtDate(s.week_of)}`, s.id)));
  DB.calls.forEach((c) => (c.tags || []).forEach((tag) => add(tag, "Call", `${c.speaker} — ${c.subject}`, c.id)));
  DB.insights.forEach((i) => (i.tags || []).forEach((tag) => add(tag, "Insight", i.text.slice(0, 60), i.id)));

  const tags = Object.keys(map).sort();
  return `
    <div class="card">
      <div class="section-title">All tags</div>
      <div>${tags.map((t) => `<button class="pill" style="cursor:pointer;border:none" data-tag="${escapeHtml(t)}">${escapeHtml(t)} (${map[t].length})</button>`).join(" ") || `<div class="muted">No tags yet.</div>`}</div>
    </div>
    ${tagsSelected && map[tagsSelected] ? `
      <div class="card">
        <div class="section-title">Tagged "${escapeHtml(tagsSelected)}"</div>
        <table><thead><tr><th>Module</th><th>Item</th></tr></thead><tbody>
          ${map[tagsSelected].map((x) => `<tr><td>${x.module}</td><td>${escapeHtml(x.label)}</td></tr>`).join("")}
        </tbody></table>
      </div>` : ""}
  `;
}
attachHandlers.tags = () => {
  document.querySelectorAll("[data-tag]").forEach((b) => b.addEventListener("click", () => { tagsSelected = b.dataset.tag; render(); }));
};

            <div class="row" style="justify-content:space-between">
              <span style="font-weight:600">${escapeHtml(t.text.slice(0, 90))}</span>
              <span class="muted">${fmtDate(t.date)}</span>
            </div>
            ${hasLinks ? `<div class="thread">
              ${linkedResearch ? `<div class="muted">→ seeded from research: ${escapeHtml(linkedResearch.topic)}</div>` : ""}
              ${spawnedResearch.map((r) => `<div class="muted">→ spawned research: ${escapeHtml(r.topic)}</div>`).join("")}
              ${calls.map((c) => `<div class="muted">→ call: ${escapeHtml(c.speaker)} — ${escapeHtml(c.subject)}</div>`).join("")}
              ${insights.map((i) => `<div class="muted">→ insight: ${escapeHtml(i.text.slice(0, 60))}</div>`).join("")}
            </div>` : `<div class="muted" style="margin-left:14px">No linked items.</div>`}
          </div>`;
      }).join("") || `<div class="muted">No thoughts logged yet.</div>`}
    </div>
  `;
}

// ---------------------------------------------------------------------------
// To-do
// ---------------------------------------------------------------------------
let todoShowDone = false;
function renderTodo() {
  const list = todoShowDone ? DB.todos : DB.todos.filter((t) => !t.done);
  return `
    <div class="card">
      <div class="section-title">Add a to-do</div>
      <div class="row">
        <label class="field">Text <input id="td-text" /></label>
        <label class="field">Type
          <select id="td-type"><option value="untagged">untagged</option><option value="action">action</option><option value="research">research</option><option value="decision">decision</option></select>
        </label>
        <button class="primary" id="td-add-btn" style="align-self:flex-end">Add</button>
      </div>
    </div>
    <div class="card">
      <label class="row"><input type="checkbox" id="td-show-done" ${todoShowDone ? "checked" : ""} /> Show completed</label>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
        ${list.map((t) => `
          <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--gridline);padding-bottom:6px">
            <label class="row" style="gap:8px">
              <input type="checkbox" data-toggle-todo="${t.id}" ${t.done ? "checked" : ""} />
              <span style="${t.done ? "text-decoration:line-through;color:var(--mist)" : ""}">${escapeHtml(t.text)}</span>
              <span class="pill">${escapeHtml(t.type)}</span>
            </label>
            <button class="tiny danger" data-del-todo="${t.id}">Delete</button>
          </div>`).join("") || `<div class="muted">Nothing here.</div>`}
      </div>
    </div>
  `;
}
attachHandlers.todo = () => {
  document.getElementById("td-add-btn").addEventListener("click", async () => {
    const text = document.getElementById("td-text").value.trim();
    if (!text) return showStatus("Text is required", true);
    try {
      await sbInsert("todos", { text, type: document.getElementById("td-type").value });
      showStatus("To-do added");
      await loadAll();
    } catch (e) { showStatus(e.message, true); }
  });
  document.getElementById("td-show-done").addEventListener("change", (e) => { todoShowDone = e.target.checked; render(); });
  document.querySelectorAll("[data-toggle-todo]").forEach((b) => b.addEventListener("change", async () => {
    try { await sbUpdate("todos", Number(b.dataset.toggleTodo), { done: b.checked }); await loadAll(); }
    catch (e) { showStatus(e.message, true); }
  }));
  document.querySelectorAll("[data-del-todo]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Delete this to-do?")) return;
    try { await sbDelete("todos", Number(b.dataset.delTodo)); showStatus("Deleted"); await loadAll(); }
    catch (e) { showStatus(e.message, true); }
  }));
};

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
document.querySelector('button.tab[data-tab="investments"]').classList.add("active");
loadAll();
</script>
</body>
</html>
